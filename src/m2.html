<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quectel Pi M2 - 3D BSP Dashboard</title>
  <style>
    :root {
      --primary: #00ffcc;
      --bg-main: #121212;
      --bg-panel: #151520;
      --bg-dark: #0a0a0f;
      --text-main: #e0e0e0;
      --text-dim: #888;
      --border: #333;
      --danger: #ff4444;
      --warning: #ffaa00;
    }

    body { margin: 0; background: var(--bg-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* --- Top Header Bar --- */
    #top-bar {
      height: 60px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
    }
    .logo { color: var(--primary); font-size: 18px; font-weight: bold; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
    
    /* System Stats */
    .sys-stats { display: flex; gap: 25px; font-size: 12px; font-family: monospace; }
    .stat-box { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { color: var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
    .stat-val { color: #fff; font-weight: bold; font-size: 14px; }
    .stat-bar-bg { width: 80px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-top: 2px; }
    .stat-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease; }
    
    /* Header Right */
    .header-right { display: flex; gap: 20px; align-items: center; }
    .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
    .dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); animation: blink 2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    /* --- Main Layout --- */
    #app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* --- Left Sidebar (Tabs) --- */
    #sidebar {
      width: 200px;
      background: var(--bg-dark);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      z-index: 50;
    }
    .tab-btn {
      background: none; border: none; color: var(--text-dim); padding: 15px 20px;
      text-align: left; font-size: 14px; cursor: pointer; transition: all 0.2s;
      border-left: 3px solid transparent; display: flex; align-items: center; gap: 10px;
    }
    .tab-btn:hover { color: #fff; background: #1a1a24; }
    .tab-btn.active { color: var(--primary); border-left-color: var(--primary); background: rgba(0, 255, 204, 0.05); font-weight: bold; }

    /* --- Main Content Area --- */
    #main-content {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 2000px;
      overflow: hidden;
    }

    /* --- Tab 1: Board View (Split Layout) --- */
    #view-board {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
      gap: 20px;
    }

    /* COMPACT Pin Grid Sidebar */
    #floating-pin-list {
      width: 320px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 15px;
    }
    #floating-pin-list h3 { margin: 0 0 15px 0; color: var(--primary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    
    /* The Grid */
    .pin-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      flex: 1;
      overflow-y: auto;
      align-content: start;
    }
    
    .pin-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    /* Hover state */
    .pin-btn:hover { border-color: var(--primary); background: #1a1a24; transform: scale(1.05); }
    
    /* Active/Selected state */
    .pin-btn.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

    /* --- GLOWING STATES --- */
    
    /* FREE (Subtle Green Glow) */
    .pin-btn.free {
      border-color: rgba(0, 255, 204, 0.3);
      box-shadow: inset 0 0 5px rgba(0, 255, 204, 0.1);
    }
    
    /* BUSY (Strong Red Glow) */
    .pin-btn.busy {
      background: rgba(255, 68, 68, 0.15);
      border-color: var(--danger);
      box-shadow: 0 0 12px rgba(255, 68, 68, 0.6), inset 0 0 8px rgba(255, 68, 68, 0.4);
      animation: pulse-red 2s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 8px rgba(255, 68, 68, 0.4), inset 0 0 5px rgba(255, 68, 68, 0.2); }
      50% { box-shadow: 0 0 16px rgba(255, 68, 68, 0.8), inset 0 0 10px rgba(255, 68, 68, 0.5); }
      100% { box-shadow: 0 0 8px rgba(255, 68, 68, 0.4), inset 0 0 5px rgba(255, 68, 68, 0.2); }
    }

    .pin-btn .num { color: #fff; font-weight: bold; font-size: 14px; font-family: monospace; }
    .pin-btn.busy .num { color: var(--danger); text-shadow: 0 0 5px var(--danger); }
    .pin-btn .type { color: var(--text-dim); font-size: 9px; text-transform: uppercase; margin-top: 2px; }

    /* Small indicator dot for status */
    .pin-btn .status-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #333; 
    }
    .pin-btn.free .status-dot { background: var(--primary); box-shadow: 0 0 5px var(--primary); }
    .pin-btn.busy .status-dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* 3D Board Area */
    #board-container-3d {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #board-3d {
      position: relative;
      width: 100%;
      max-width: 900px;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .board-face {
      width: 100%;
      backface-visibility: hidden;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background: #000;
    }
    .front { transform: rotateY(0deg); z-index: 2; }
    .back { position: absolute; top: 0; left: 0; transform: rotateY(180deg); }
    .board-image { display: block; width: 100%; height: auto; }

    /* --- Tab 2: Full Table View --- */
    #view-table {
      width: 90%;
      max-width: 1000px;
      height: 90%;
      background: var(--bg-panel);
      border-radius: 8px;
      padding: 20px;
      display: none;
      flex-direction: column;
      border: 1px solid var(--border);
    }
    #search-bar-table {
      width: 100%; padding: 12px; margin-bottom: 15px;
      background: var(--bg-dark); border: 1px solid var(--border); color: #fff;
      border-radius: 4px; font-size: 14px; outline: none;
    }
    #search-bar-table:focus { border-color: var(--primary); }
    .table-container { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px 15px; border-bottom: 1px solid #222; }
    th { background: var(--bg-dark); color: var(--text-dim); position: sticky; top: 0; font-size: 12px; text-transform: uppercase; }
    tr:hover { background: #1a1a24; cursor: pointer; }
    td.pin-num { color: var(--primary); font-weight: bold; font-family: monospace; }
    td.pin-name { color: #fff; font-family: monospace; }
    td.pin-func { color: var(--text-dim); font-size: 12px; }

    /* --- Hotspots --- */
    .pin-hotspot {
      position: absolute;
      width: 16px; height: 20px; 
      background: rgba(0, 255, 204, 0.15); 
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 3px; cursor: pointer;
      transform: translate(-50%, -50%); 
      transition: background 0.2s, box-shadow 0.2s;
    }
    .pin-hotspot:hover, .pin-hotspot.active {
      background: rgba(0, 255, 204, 0.9); box-shadow: 0 0 10px var(--primary);
      z-index: 10; border-color: var(--primary);
    }
    .pin-hotspot.busy-pin {
      background: rgba(255, 68, 68, 0.15);
      border-color: rgba(255, 68, 68, 0.4);
    }
    .pin-hotspot.busy-pin:hover {
      background: rgba(255, 68, 68, 0.9); box-shadow: 0 0 10px var(--danger);
      border-color: var(--danger);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(0, 255, 204, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
    }
    .pin-hotspot.locate-highlight { background: var(--primary); animation: pulse 1.5s infinite; z-index: 20; }

    .port-hotspot {
      position: absolute; background: rgba(0, 255, 204, 0.05);
      border: 2px dashed rgba(0, 255, 204, 0.2); border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
      display: flex; justify-content: center; align-items: center;
    }
    .port-hotspot:hover, .port-hotspot.active {
      background: rgba(0, 255, 204, 0.15); border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); z-index: 10;
    }
    .port-label { color: rgba(0, 255, 204, 0.5); font-weight: bold; font-size: 10px; pointer-events: none; letter-spacing: 1px; text-align: center; }
    .port-hotspot:hover .port-label { color: var(--primary); }

    /* --- UI Panel --- */
    #ui-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 20, 25, 0.95); border: 1px solid var(--primary);
      padding: 20px; border-radius: 8px; width: 300px; display: none;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.15); z-index: 100;
      backdrop-filter: blur(10px);
    }
    #close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-dim); font-size: 20px; font-weight: bold; cursor: pointer; line-height: 1; }
    #close-btn:hover { color: var(--primary); }
    h2 { margin: 0 0 5px 0; color: var(--primary); font-size: 18px; text-transform: uppercase; padding-right: 25px; }
    .pin-header { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tag { background: #1a1a24; color: var(--primary); border: 1px solid var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-family: monospace; }
    .tag.primary { background: var(--primary); color: #000; font-weight: bold; }
    .control-row { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border-radius: 6px; border: 1px solid var(--border); margin-top: 15px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(24px); }
    input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

    #locate-btn {
      display: none; width: 100%; margin-top: 10px; padding: 8px;
      background: transparent; border: 1px dashed var(--primary); color: var(--primary);
      border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s;
    }
    #locate-btn:hover { background: rgba(0, 255, 204, 0.1); }

    #tooltip {
      position: absolute; background: var(--primary); color: #000; padding: 4px 8px;
      border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none;
      display: none; z-index: 200; transform: translate(-50%, -150%); white-space: nowrap;
    }
    #tooltip.busy { background: var(--danger); color: #fff; }

    .flip-btn, .reset-btn {
      background: transparent; color: var(--primary); border: 1px solid var(--primary);
      padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: all 0.2s;
    }
    .flip-btn:hover, .reset-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
    .reset-btn { color: var(--danger); border-color: var(--danger); }
    .reset-btn:hover { background: var(--danger); color: #fff; box-shadow: 0 0 15px var(--danger); }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <div id="top-bar">
    <div class="logo">🔲 Quectel Pi M2</div>
    
    <!-- System Stats -->
    <div class="sys-stats">
      <div class="stat-box">
        <span class="stat-label">CPU Temp</span>
        <span class="stat-val" id="cpu-temp">-- °C</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">CPU Load</span>
        <span class="stat-val" id="cpu-load">-- %</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="cpu-bar" style="background: var(--primary);"></div></div>
      </div>
      <div class="stat-box">
        <span class="stat-label">RAM</span>
        <span class="stat-val" id="ram-load">-- %</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="ram-bar" style="background: var(--warning);"></div></div>
      </div>
      <div class="stat-box">
        <span class="stat-label">Storage</span>
        <span class="stat-val" id="disk-load">-- %</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="disk-bar" style="background: #ff44ff;"></div></div>
      </div>
    </div>

    <div class="header-right">
      <div class="status-indicator" id="system-status">
        <div class="dot"></div>
        Connecting...
      </div>
      <button class="reset-btn" onclick="resetSystem()">⟲ Reset UI</button>
    </div>
  </div>

  <!-- Main App Area -->
  <div id="app-container">

    <!-- Left Sidebar -->
    <div id="sidebar">
      <button class="tab-btn active" id="tab-btn-board" onclick="switchTab('board')">🖥️ Board View</button>
      <button class="tab-btn" id="tab-btn-table" onclick="switchTab('table')">📋 Full Pin Table</button>
    </div>

    <!-- Main Content -->
    <div id="main-content">
      
      <!-- Tab 1: Board View -->
      <div id="view-board">
        
        <!-- COMPACT Pin Grid Sidebar -->
        <div id="floating-pin-list">
          <h3>Pin Reference</h3>
          <div class="pin-grid" id="board-pin-list">
            <!-- Generated by JS -->
          </div>
        </div>

        <!-- 3D Board -->
        <div id="board-container-3d">
          <div id="board-3d">
            <div class="board-face front" id="front-face">
              <img class="board-image" src="m2-front.png" alt="Front">
            </div>
            <div class="board-face back">
              <img class="board-image" src="m2-back.png" alt="Back">
            </div>
          </div>
          <button class="flip-btn" style="margin-top: 20px;" onclick="flipBoard()">⟲ Flip Board 180°</button>
        </div>

      </div>

      <!-- Tab 2: Full Table View -->
      <div id="view-table">
        <input type="text" id="search-bar-table" placeholder="Search by function, pin name, or status (FREE/BUSY)..." onkeyup="filterFullTable()">
        <div class="table-container">
          <table id="full-pin-table">
            <thead>
              <tr>
                <th>Pin</th>
                <th>Primary GPIO & Status</th>
                <th>Linux ID / Consumer</th>
                <th>Alternate Functions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- UI Panel (Shared) -->
      <div id="ui-panel">
        <button id="close-btn" title="Close Panel">×</button>
        <h2 id="ui-type">BSP Control</h2>
        <div class="pin-header"><span id="ui-title">-</span></div>
        
        <div id="primary-function-container">
          <div id="status-message" style="margin-bottom: 15px; font-size: 12px; font-weight: bold;"></div>
          
          <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">Primary Function:</div>
          <div class="tag-container" id="primary-tag"></div>
          <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">Multiplexing:</div>
          <div class="tag-container" id="alt-tags"></div>
        </div>

        <div class="control-row" id="toggle-row">
          <span style="font-size: 14px;">Output State</span>
          <label class="switch">
            <input type="checkbox" id="toggle-switch">
            <span class="slider"></span>
          </label>
        </div>
        
        <button id="locate-btn" onclick="locateCurrentItem()">📍 Find on Board</button>
      </div>

      <div id="tooltip">Pin 1</div>
    </div>

  </div>

  <script>
    // --- 1. Logic to map hardware names to Linux lines ---
    function getChipAndLine(pinName) {
      const match = pinName.match(/GPIO(\d)_([A-D])(\d)/);
      if (!match) return null;
      const chip = parseInt(match[1]);
      const bank = { 'A': 0, 'B': 8, 'C': 16, 'D': 24 }[match[2]];
      const num = parseInt(match[3]);
      return { chip: `gpiochip${chip}`, line: (bank + num).toString() };
    }

    // --- 2. Raw Pin Data ---
    const rawPinData = {
      1: { name: "VCC 3V3", functions: [] }, 2: { name: "VCC 5V", functions: [] },
      3: { name: "GPIO4_B4_d", functions: ["I2C3_SDA", "CAN1_RX_M2", "UART2_RX_M1"] }, 4: { name: "VCC 5V", functions: [] },
      5: { name: "GPIO4_B5_d", functions: ["I2C3_SCL", "CAN1_TX_M2", "PCIE0_CLKREQN_M2", "UART2_TX_M1"] }, 6: { name: "GND", functions: [] },
      7: { name: "GPIO2_B7_d", functions: ["I2C8_SDA_M2", "UART8_CTSN_M1", "UART7_RX_M0", "SAI0_LRCK_M0", "ETH0_RXD2_M1"] }, 8: { name: "GPIO2_B0_d", functions: ["UART1_TXD", "SDMMC1_D2_M1", "ETH0_TXD1_M1", "SAI0_SDI0_M0", "PDM0_SDI3_M3"] },
      9: { name: "GND", functions: [] }, 10: { name: "GPIO2_B1_d", functions: ["UART1_RXD", "SDMMC1_D3_M1", "ETH0_TXD0_M1", "SAI0_SDI1_M0", "PDM0_SDI2_M3"] },
      11: { name: "GPIO2_B6_d", functions: ["I2C8_SCL_M2", "UART8_RTSN_M1", "UART7_TX_M0", "SAI0_SCLK_M0"] }, 12: { name: "GPIO2_C7_d", functions: ["ETH1_TXD1_M0", "SAI4_LRCK_M3", "UART4_RTSN_M0", "I2C5_SDA_M2", "PWM0_CH1_M2"] },
      13: { name: "GPIO2_A6_d", functions: ["SPI4_CSN1_M3", "I2C4_SCL_M2", "UART8_TX_M1", "SAI0_SDO0_M0", "SDMMC1_D0_M1"] }, 14: { name: "GND", functions: [] },
      15: { name: "GPIO2_A7_d", functions: ["I2C4_SDA_M2", "UART8_RX_M1", "SAI0_SDO1_M0", "SDMMC1_D1_M1"] }, 16: { name: "GPIO4_A4_d", functions: ["SAI4_SCLK_M0", "PDM1_SDI3_M1", "SPI3_MOSI_M2", "UART6_TX_M0", "I2C4_SCL_M1", "CAN0_TX_M2"] },
      17: { name: "VCC 3V3", functions: [] }, 18: { name: "GPIO4_A6_d", functions: ["SAI4_LRCK_M0", "PDM1_CLK0_M1", "SPI3_MISO_M2", "UART6_RX_M0", "I2C4_SDA_M1", "CAN0_RX_M2"] },
      19: { name: "GPIO2_C2_d", functions: ["SPI_MOSI", "PWM1_CH2_M2", "SPI1_MOSI_M1", "UART11_CTSN_M1", "PDM1_SDI2_M0", "SAI2_SCLK_M1"] }, 20: { name: "GND", functions: [] },
      21: { name: "GPIO2_C3_d", functions: ["SPI_MISO", "PWM0_CH0_M2", "SPI1_MISO_M1", "UART11_RTSN_M1", "PDM1_SDI3_M0", "SAI2_LRCK_M1"] }, 22: { name: "GPIO2_B4_d", functions: ["SDMMC1_PWREN_M1", "ETH0_TXD2_M1", "SAI0_SDI3_M0", "UART7_CTSN_M0", "SPI4_MOSI_M3", "SATA0_ACTLED_M0"] },
      23: { name: "GPIO2_C5_d", functions: ["SPI_CLK", "PWM1_CH4_M2", "SPI1_CLK_M1", "UART11_RX_M1", "PDM1_CLK0_M0", "SAI2_SDI_M1"] }, 24: { name: "GPIO2_C4_d", functions: ["SPI_CE0", "SAI2_SDO_M1", "PDM1_SDI0_M0", "UART11_TX_M1", "SPI1_CSN0_M1", "PWM1_CH3_M2"] },
      25: { name: "GND", functions: [] }, 26: { name: "GPIO2_C1_d", functions: ["SPI_CE1", "SAI2_MCLK_M1", "UART9_TX_M0", "SPI1_CSN1_M1", "PWM1_CH1_M2"] },
      27: { name: "GPIO3_A1_d", functions: ["I2C7_SDA", "I2C7_SDA_M1", "SPI3_MOSI_M0", "UART3_RX_M0", "SAI3_LRCK_M2", "ETH0_MDC_M1"] }, 28: { name: "GPIO3_A0_d", functions: ["I2C7_SCL", "I2C7_SCL_M1", "UART3_TX_M0", "SPI3_CLK_M0", "SAI3_SCLK_M2"] },
      29: { name: "GPIO2_D5_d", functions: ["PWM2_CH5_M2", "I2C9_SCL_M2", "UART6_CTSN_M1"] }, 30: { name: "GND", functions: [] },
      31: { name: "GPIO2_D4_d", functions: ["PWM2_CH4_M2", "I2C9_SDA_M2", "UART6_RTSN_M1"] }, 32: { name: "GPIO2_B5_d", functions: ["SDMMC1_DETN_M1", "ETH0_RXCLK_M1", "SAI0_MCLK_M0", "PDM0_CLK0_M3", "UART7_RTSN_M0", "SPI4_MISO_M3", "SATA1_ACTLED_M0"] },
      33: { name: "GPIO2_D3_d", functions: ["PWM", "PWM2_CH3_M2", "I3C1_SDA_M0", "UART6_RX_M1"] }, 34: { name: "GND", functions: [] },
      35: { name: "GPIO2_C6_d", functions: ["PWM1_CH5_M2", "I2C5_SCL_M2", "UART4_CTSN_M0", "SAI4_SCLK_M3"] }, 36: { name: "GPIO2_D2_d", functions: ["CAM_CLK0_OUT_M1", "SAI4_MCLK_M3", "UART6_TX_M1", "I3C1_SCL_M0", "PWM2_CH2_M2"] },
      37: { name: "GPIO2_D7_d", functions: ["PWM2_CH7_M2", "SPI3_CSN1_M0", "UART9_CTSN_M0", "SAI0_SDO3_M0", "ETH_CLK0_25M_OUT_M1", "CAM_CLK2_OUT_M1"] }, 38: { name: "GPIO2_D0_d", functions: ["SAI4_SDI_M3", "UART4_TX_M0", "I2C6_SCL_M2", "PWM2_CH0_M2"] },
      39: { name: "GND", functions: [] }, 40: { name: "GPIO2_D1_d", functions: ["ETH1_RXD0_M0", "SAI4_SDO_M3", "UART4_RX_M0", "I2C6_SDA_M2", "PWM2_CH1_M2"] }
    };

    // --- 3. Live Data Fetching ---
    let consumedLines = {}; 
    let pinDatabase = {};   
    let dataLoaded = false;

    async function fetchLiveGPIO() {
      try {
        const response = await fetch('http://127.0.0.1:5050/api/gpio');
        if (response.ok) {
          consumedLines = await response.json();
          updateDashboardLive();
          document.getElementById('system-status').innerHTML = `<div class="dot"></div> Live`;
        }
      } catch (err) {
        document.getElementById('system-status').innerHTML = `<div class="dot" style="background:#ff4444; box-shadow:0 0 10px #ff4444;"></div> Offline`;
        if (!dataLoaded) updateDashboardLive(); 
      }
    }

    // --- 4. Fetch System Stats ---
    async function fetchSystemStats() {
      try {
        const response = await fetch('http://127.0.0.1:5050/api/system');
        if (response.ok) {
          const data = await response.json();
          
          document.getElementById('cpu-temp').innerText = `${data.temp.toFixed(1)} °C`;
          document.getElementById('cpu-load').innerText = `${data.cpu}%`;
          document.getElementById('cpu-bar').style.width = `${data.cpu}%`;
          
          document.getElementById('ram-load').innerText = `${data.ram.percent}%`;
          document.getElementById('ram-bar').style.width = `${data.ram.percent}%`;
          document.getElementById('ram-load').title = `${data.ram.used} GB / ${data.ram.total} GB`;
          
          document.getElementById('disk-load').innerText = `${data.disk.percent}%`;
          document.getElementById('disk-bar').style.width = `${data.disk.percent}%`;
          document.getElementById('disk-load').title = `${data.disk.used} GB / ${data.disk.total} GB`;
        }
      } catch (err) {
        console.log("System stats unavailable");
      }
    }

    function updateDashboardLive() {
      for (let i = 1; i <= 40; i++) {
        const pin = Object.assign({}, rawPinData[i]);
        const logic = getChipAndLine(pin.name);
        
        if (logic) {
          const consumer = consumedLines[logic.chip] ? consumedLines[logic.chip][logic.line] : null;
          pin.hardwareId = `${logic.chip} line ${logic.line}`;
          pin.isBusy = !!consumer;
          pin.consumer = consumer || "None";
        } else {
          pin.hardwareId = "N/A";
          pin.isBusy = false;
          pin.consumer = "None";
        }
        pinDatabase[i] = pin;
      }
      
      dataLoaded = true;
      buildFloatingList(); // This rebuilds the grid with the new classes
      buildFullTable();
      
      // Update 3D Board hotspots
      for (let i = 1; i <= 40; i++) {
        const el = pinElementsMap[i];
        if (el) {
          if (pinDatabase[i].isBusy) el.classList.add('busy-pin');
          else el.classList.remove('busy-pin');
        }
      }
    }

    // Interface Data
    const interfaceDatabase = {
      "ETH": { title: "Gigabit Ethernet", desc: "10/100/1000 Mbps Ethernet with PoE capability", tags: ["LAN", "PoE"] },
      "USB_TOP": { title: "USB 3.0 Type-A (Top)", desc: "Host mode only, max 5 Gbps", tags: ["USB 3.0", "Host"] },
      "USB_BOT": { title: "USB 3.0 Type-A (Bottom)", desc: "Host/Device mode, used for firmware flashing", tags: ["USB 3.0", "OTG"] },
      "SD": { title: "SD Card Slot", desc: "SD 3.0, 4-bit SDIO, flip-top socket", tags: ["SD 3.0"] },
      "HDMI": { title: "HDMI 2.1", desc: "4096 x 1080 @ 60 fps output", tags: ["Display", "4K"] },
      "POWER": { title: "USB Type-C Power", desc: "Primary power supply (5V/3A+). Supports PD.", tags: ["Power", "PD"] },
      "AUDIO": { title: "Audio Jack", desc: "3.5mm headphone jack", tags: ["Audio", "Mic"] },
      "CAM": { title: "Camera FPC", desc: "MIPI CSI camera connector", tags: ["MIPI", "FPC"] }
    };

    // --- 5. Calibrated Coordinates ---
    const config = {
      gpio: { startX: 10.0, startY: 5, rowSpacing: 4, pinSpacing: 2.9 },
      ports: [
        { id: "ETH", name: "ETH", x: 85, y: 15, w: 20, h: 20 }, 
        { id: "USB_TOP", name: "USB\n3.0", x: 89, y: 45, w: 16, h: 14 }, 
        { id: "USB_BOT", name: "USB\n3.0", x: 89, y: 72, w: 16, h: 14 }, 
        { id: "SD", name: "SD\nCARD", x: 46, y: 32, w: 12, h: 18 }, 
        { id: "POWER", name: "POWER", x: 16, y: 86, w: 8, h: 12 }, 
        { id: "HDMI", name: "HDMI", x: 31, y: 86, w: 14, h: 14 }, 
        { id: "CAM", name: "CAM", x: 52, y: 85, w: 4, h: 14 }, 
        { id: "AUDIO", name: "AUDIO", x: 61, y: 87, w: 6, h: 12 } 
      ]
    };

    // --- 6. State & DOM Elements ---
    const container = document.getElementById('front-face'); 
    const board3d = document.getElementById('board-3d');
    const tooltip = document.getElementById('tooltip');
    const uiPanel = document.getElementById('ui-panel');
    const closeBtn = document.getElementById('close-btn');
    const locateBtn = document.getElementById('locate-btn');
    
    const uiType = document.getElementById('ui-type');
    const uiTitle = document.getElementById('ui-title');
    const statusMessage = document.getElementById('status-message');
    const primaryTag = document.getElementById('primary-tag');
    const altTags = document.getElementById('alt-tags');
    const toggleSwitch = document.getElementById('toggle-switch');
    
    let activeElement = null;
    let isFlipped = false;
    let currentTab = 'board';
    const pinElementsMap = {}; 

    // --- 7. System Reset ---
    function resetSystem() {
      closeBtn.click();
      toggleSwitch.checked = false;
      document.querySelectorAll('.pin-hotspot').forEach(el => el.classList.remove('locate-highlight'));
      document.querySelectorAll('.pin-btn').forEach(el => el.classList.remove('active'));
    }

    // --- 8. Tab Switching Logic ---
    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      if (tabId === 'board') {
        document.getElementById('tab-btn-board').classList.add('active');
        document.getElementById('view-board').style.display = 'flex';
        document.getElementById('view-table').style.display = 'none';
      } else {
        document.getElementById('tab-btn-table').classList.add('active');
        document.getElementById('view-board').style.display = 'none';
        document.getElementById('view-table').style.display = 'flex';
      }
    }

    // --- 9. The "Locate on Board" Feature ---
    function focusPinOnBoard(pinId) {
      if (isFlipped) flipBoard();
      if (currentTab !== 'board') switchTab('board');

      document.querySelectorAll('.pin-hotspot').forEach(el => el.classList.remove('locate-highlight'));
      document.querySelectorAll('.pin-btn').forEach(el => el.classList.remove('active'));
      
      const targetEl = pinElementsMap[pinId];
      if (targetEl) {
        targetEl.classList.add('locate-highlight');
        
        // Highlight in grid
        const gridItem = document.getElementById(`grid-item-${pinId}`);
        if(gridItem) {
          gridItem.classList.add('active');
          gridItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        if (activeElement) activeElement.classList.remove('active');
        targetEl.classList.add('active');
        activeElement = targetEl;
        openGPIOUI(pinId);
        
        setTimeout(() => {
          targetEl.classList.remove('locate-highlight');
        }, 3000);
      }
    }

    function locateCurrentItem() {
      if (activeElement && activeElement.dataset.type === 'gpio') {
        focusPinOnBoard(activeElement.dataset.id);
      }
    }

    // --- 10. Build COMPACT Grid ---
    function buildFloatingList() {
      const listContainer = document.getElementById('board-pin-list');
      listContainer.innerHTML = '';
      
      for (let i = 1; i <= 40; i++) {
        const data = pinDatabase[i];
        if (!data) continue; 

        // Determine type text
        let typeText = "GPIO";
        if (data.name.includes("VCC")) typeText = "PWR";
        if (data.name.includes("GND")) typeText = "GND";
        
        // Determine status class
        let statusClass = "";
        if (!data.name.includes("VCC") && !data.name.includes("GND")) {
           statusClass = data.isBusy ? "busy" : "free";
        }

        const div = document.createElement('div');
        div.className = `pin-btn ${statusClass}`;
        div.id = `grid-item-${i}`;
        div.innerHTML = `
          <div class="status-dot"></div>
          <span class="num">${i}</span>
          <span class="type">${typeText}</span>
        `;
        div.onclick = () => focusPinOnBoard(i);
        listContainer.appendChild(div);
      }
    }

    function buildFullTable() {
      const tbody = document.querySelector('#full-pin-table tbody');
      tbody.innerHTML = ''; 

      for (let i = 1; i <= 40; i++) {
        const data = pinDatabase[i];
        if (!data) continue; 

        let badge = '';
        let consumerText = data.hardwareId !== "N/A" ? `<span style="color:#888;">${data.hardwareId}</span>` : '-';
        
        if (!data.name.includes("GND") && !data.name.includes("VCC")) {
          badge = `<span class="status-badge ${data.isBusy ? 'status-busy' : 'status-free'}">${data.isBusy ? 'BUSY' : 'FREE'}</span>`;
          if (data.isBusy) {
             consumerText = `<span style="color:#ff4444;">${data.consumer}</span><br><small style="color:#888;">${data.hardwareId}</small>`;
          }
        }
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="pin-num">${i}</td>
          <td class="pin-name">${data.name}<br>${badge}</td>
          <td class="pin-func">${consumerText}</td>
          <td class="pin-func">${data.functions.join(', ') || '-'}</td>
        `;
        tr.addEventListener('click', () => focusPinOnBoard(i));
        tbody.appendChild(tr);
      }
    }

    function filterFullTable() {
      const query = document.getElementById('search-bar-table').value.toLowerCase();
      const rows = document.querySelectorAll('#full-pin-table tbody tr');
      rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
      });
    }

    // --- 11. 3D Board Logic ---
    function flipBoard() {
      isFlipped = !isFlipped;
      board3d.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
      if (isFlipped) closeBtn.click();
    }

    function generateGPIO() {
      for (let col = 0; col < 20; col++) {
        const currentX = config.gpio.startX + (col * config.gpio.pinSpacing);
        
        const oddPin = (col * 2) + 1;
        const oddBtn = document.createElement('div');
        oddBtn.className = 'pin-hotspot';
        oddBtn.dataset.type = 'gpio';
        oddBtn.dataset.id = oddPin;
        oddBtn.style.left = `${currentX}%`;
        oddBtn.style.top = `${config.gpio.startY + config.gpio.rowSpacing}%`; 
        addEvents(oddBtn, `Pin ${oddPin}`, oddPin);
        container.appendChild(oddBtn);
        pinElementsMap[oddPin] = oddBtn; 

        const evenPin = (col * 2) + 2;
        const evenBtn = document.createElement('div');
        evenBtn.className = 'pin-hotspot';
        evenBtn.dataset.type = 'gpio';
        evenBtn.dataset.id = evenPin;
        evenBtn.style.left = `${currentX}%`;
        evenBtn.style.top = `${config.gpio.startY}%`; 
        addEvents(evenBtn, `Pin ${evenPin}`, evenPin);
        container.appendChild(evenBtn);
        pinElementsMap[evenPin] = evenBtn; 
      }
    }

    function generatePorts() {
      config.ports.forEach(port => {
        const div = document.createElement('div');
        div.className = 'port-hotspot';
        div.dataset.type = 'port';
        div.dataset.id = port.id;
        div.style.left = `${port.x}%`;
        div.style.top = `${port.y}%`;
        div.style.width = `${port.w}%`;
        div.style.height = `${port.h}%`;
        div.style.transform = 'translate(-50%, -50%)';
        div.innerHTML = `<span class="port-label">${port.name}</span>`;
        addEvents(div, interfaceDatabase[port.id].title, null);
        container.appendChild(div);
      });
    }

    function addEvents(el, tooltipText, pinId) {
      el.addEventListener('mouseenter', () => {
        if (isFlipped) return; 
        const rect = el.getBoundingClientRect();
        tooltip.style.display = 'block';
        tooltip.style.left = `${rect.left + rect.width / 2}px`;
        tooltip.style.top = `${rect.top}px`;
        
        if (pinId && pinDatabase[pinId] && pinDatabase[pinId].isBusy) {
          tooltip.className = 'busy';
          tooltip.innerText = `${tooltipText} - BUSY`;
        } else {
          tooltip.className = '';
          tooltip.innerText = tooltipText;
        }
      });
      
      el.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });

      el.addEventListener('click', () => {
        if (isFlipped) return;
        if (activeElement) activeElement.classList.remove('active');
        el.classList.add('active');
        activeElement = el;
        
        if (el.dataset.type === 'gpio') openGPIOUI(el.dataset.id);
        else openPortUI(el.dataset.id);
      });
    }

    // --- 12. UI Panel Logic ---
    closeBtn.addEventListener('click', () => {
      uiPanel.style.display = 'none';
      if (activeElement) {
        activeElement.classList.remove('active');
        activeElement = null;
      }
    });

    function openGPIOUI(pinId) {
      const data = pinDatabase[pinId];
      if (!data) return;

      uiPanel.style.display = 'block';
      uiType.innerText = "GPIO BSP Control";
      uiTitle.innerHTML = `Pin <span style="color:#fff; font-size: 16px; font-weight:bold;">${pinId}</span>`;
      
      if (data.isBusy) {
        statusMessage.innerHTML = `<span style="color: #ff4444;">STATUS: BUSY</span><br><span style="color:#aaa; font-size:11px; font-weight:normal;">Claimed by: ${data.consumer} (${data.hardwareId})</span>`;
      } else if (data.hardwareId !== "N/A") {
        statusMessage.innerHTML = `<span style="color: var(--primary);">STATUS: FREE</span><br><span style="color:#aaa; font-size:11px; font-weight:normal;">Linux ID: ${data.hardwareId}</span>`;
      } else {
        statusMessage.innerHTML = `<span style="color: var(--text-dim);">POWER / GROUND</span>`;
      }

      primaryTag.innerHTML = `<div class="tag primary">${data.name}</div>`;
      
      altTags.innerHTML = data.functions.length > 0 
        ? data.functions.map(f => `<div class="tag">${f}</div>`).join('')
        : `<span style="font-size: 11px; color: #666;">No alternate functions</span>`;

      toggleSwitch.disabled = data.name.includes("VCC") || data.name.includes("GND") || data.isBusy;
      
      if (data.isBusy) {
         toggleSwitch.title = "Cannot toggle. Pin is currently claimed by the OS.";
      } else {
         toggleSwitch.title = "";
      }
      
      toggleSwitch.checked = false;
      locateBtn.style.display = 'block';
    }

    function openPortUI(portId) {
      const data = interfaceDatabase[portId];
      uiPanel.style.display = 'block';
      uiType.innerText = "Interface Control";
      uiTitle.innerText = data.title;
      
      statusMessage.innerHTML = `<span style="color: var(--primary);">INTERFACE READY</span>`;
      
      primaryTag.innerHTML = data.tags.map(t => `<div class="tag primary">${t}</div>`).join('');
      altTags.innerHTML = `<div style="font-size: 12px; color: #aaa; line-height: 1.4;">${data.desc}</div>`;
      
      toggleSwitch.disabled = false;
      toggleSwitch.checked = false;
      locateBtn.style.display = 'none';
    }

    toggleSwitch.addEventListener('change', (e) => {
      if (!activeElement) return;
      const id = activeElement.dataset.id;
      const isOn = e.target.checked;
      const type = activeElement.dataset.type;
      
      const statusEl = document.querySelector('.status-indicator');
      statusEl.innerHTML = `<div class="dot" style="background: ${isOn ? '#00ffcc' : '#ff4444'}; box-shadow: 0 0 10px ${isOn ? '#00ffcc' : '#ff4444'};"></div> SIMULATED: ${type.toUpperCase()} ${id} ${isOn ? 'ON' : 'OFF'}`;
    });

    // --- Initialize ---
    generateGPIO();
    generatePorts();
    
    // Fetch GPIO data every 0.5 seconds (500ms)
    fetchLiveGPIO();
    setInterval(fetchLiveGPIO, 500); 
    
    // Fetch System Stats every 2 seconds
    fetchSystemStats();
    setInterval(fetchSystemStats, 2000);
  </script>
</body>
</html>
